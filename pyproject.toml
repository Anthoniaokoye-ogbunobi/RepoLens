[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens"
version = "0.1.0"
description = "A tool for analyzing Git repository history and software evolution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

